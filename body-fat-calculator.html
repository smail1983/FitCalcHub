<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Fat Calculator | FitCalcHub</title><meta name="description" content="Estimate body fat percentage using the US Navy method.">
<link rel="stylesheet" href="style.css">
</head>
<body><div class="nav"><div class="nav-inner"><a class="logo" href="index.html">FitCalcHub</a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></div><main class="container">
<div class="page"><a class="back" href="index.html">← Home</a><h1>Body Fat Calculator</h1>
<div class="card"><div class="form-grid">
<div><label>Gender</label><select id="g"><option value="m">Male</option><option value="f">Female</option></select></div>
<div><label>Height (cm)</label><input id="he" type="number" min="1"></div>
<div><label>Neck (cm)</label><input id="ne" type="number" min="1"></div>
<div><label>Waist (cm)</label><input id="wa" type="number" min="1"></div>
<div class="full"><label>Hip (cm) — women</label><input id="hi" type="number" min="1"></div>
</div><button class="btn" id="bfBtn" style="border:0;cursor:pointer">Calculate</button><div class="result" id="res">Enter your measurements.</div></div></div>
<style>.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.full{grid-column:1/-1}.result{margin-top:16px;padding:18px;background:#0f172a;color:#fff;border-radius:12px;text-align:center;font-size:1.2rem}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<script>document.getElementById('bfBtn').addEventListener('click',()=>{const h=Number(he.value),n=Number(ne.value),w=Number(wa.value),hip=Number(hi.value),female=g.value==='f';if(!(h>0&&n>0&&w>0)|| (female&&!(hip>0))){res.textContent='Please enter valid measurements.';return;}let bf;if(!female){const x=w-n;if(x<=0){res.textContent='Waist must be greater than neck.';return;}bf=495/(1.0324-0.19077*Math.log10(x)+0.15456*Math.log10(h))-450;}else{const x=w+hip-n;if(x<=0){res.textContent='Please check your measurements.';return;}bf=495/(1.29579-0.35004*Math.log10(x)+0.221*Math.log10(h))-450;}res.textContent=bf.toFixed(1)+'% estimated body fat';});</script>
