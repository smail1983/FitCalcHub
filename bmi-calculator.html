<body><div class="nav"><div class="nav-inner"><a class="logo" href="index.html">FitCalcHub</a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></div><main class="container">
<div class="page"><a class="back" href="index.html">← Home</a><h1>BMI Calculator</h1>
<div class="card">
<label>Weight (kg)</label><input id="w" type="number" min="1" placeholder="e.g. 70">
<label style="margin-top:14px">Height (cm)</label><input id="h" type="number" min="50" placeholder="e.g. 175">
<button class="btn" id="bmiBtn" style="border:0;cursor:pointer">Calculate</button>
<div class="result" id="r">Enter your height and weight.</div>
</div></div>
<style>label{display:block;font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase}input{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px}.result{margin-top:16px;padding:18px;background:#0f172a;color:#fff;border-radius:12px;text-align:center;font-size:1.2rem}</style>
<script>document.getElementById('bmiBtn').addEventListener('click',()=>{const W=Number(document.getElementById('w').value),H=Number(document.getElementById('h').value)/100;if(!(W>0&&H>0)){r.textContent='Please enter valid values.';return;}const bmi=W/(H*H);const cat=bmi<18.5?'Underweight':bmi<25?'Normal range':bmi<30?'Overweight':'Obesity';r.textContent=bmi.toFixed(1)+' — '+cat;});</script>
