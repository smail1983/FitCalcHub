<div class="page"><a class="back" href="index.html">← Home</a><h1>TDEE Calculator</h1>
<div class="card">
<div class="form-grid">
<div><label>Gender</label><select id="gender"><option value="male">Male</option><option value="female">Female</option></select></div>
<div><label>Age</label><input id="age" type="number" min="1" max="120" placeholder="e.g. 30"></div>
<div><label>Weight (kg)</label><input id="weight" type="number" min="1" placeholder="e.g. 70"></div>
<div><label>Height (cm)</label><input id="height" type="number" min="50" placeholder="e.g. 175"></div>
<div class="full"><label>Activity</label><select id="act"><option value="1.2">Sedentary</option><option value="1.375">Lightly active</option><option value="1.55">Moderately active</option><option value="1.725">Very active</option><option value="1.9">Extra active</option></select></div>
</div>
<button class="btn" id="calcBtn" style="border:0;cursor:pointer">Calculate</button>
<div class="result" id="res">Enter your details to see an estimate.</div>
</div></div>
<style>.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:.78rem;font-weight:700;color:#475569;text-transform:uppercase}input,select{width:100%;padding:11px;margin-top:6px;border:1px solid #cbd5e1;border-radius:10px;background:#fff}.full{grid-column:1/-1}.result{background:#0f172a;color:#fff;border-radius:14px;padding:18px;text-align:center;margin-top:16px;font-size:1.2rem}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}}</style>
<script>
document.getElementById('calcBtn').addEventListener('click',()=>{
 const w=Number(document.getElementById('weight').value), h=Number(document.getElementById('height').value), a=Number(document.getElementById('age').value), activity=Number(document.getElementById('act').value), gender=document.getElementById('gender').value;
 if(!(w>0&&h>0&&a>0)){document.getElementById('res').textContent='Please enter valid age, weight and height.';return;}
 const bmr=gender==='male'?10*w+6.25*h-5*a+5:10*w+6.25*h-5*a-161;
 document.getElementById('res').textContent=Math.round(bmr*activity)+' kcal / day (estimated TDEE)';
});
</script>
